<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Týdenní PPC novinky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&family=Noto+Serif:ital,wght@1,600&display=swap">
<style>
/* Layout: jeden čitelný sloupec, nahoře archiv týdnů jako chipy, pod tím sekce podle platforem. Jen světlý režim (manuál Advisio 2026). */
:root {
  --advisio-red: #E7302A;
  --advisio-navy: #213A4B;
  --advisio-tint: #CCD3D7;
  --bg: #FFFFFF;
  --surface: #F5F7F8;
  --text: var(--advisio-navy);
  --text-muted: #6B7C88;
  --accent: var(--advisio-red);
  --border: #DDE3E6;
  --font-heading: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-emphasis: "Noto Serif", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --channel-sklik: #D61116;
  --channel-bing: #008373;
  --channel-heureka: #FF660A;
  --channel-zbozi: #DC1F27;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(180deg, var(--advisio-tint) 0%, #FFFFFF 58vh);
}
.bg-cesta {
  position: absolute; inset: 0; color: var(--advisio-navy); opacity: .05; line-height: 0;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 52%, transparent 94%);
  mask-image: linear-gradient(180deg, #000 0%, #000 52%, transparent 94%);
}
.bg-cesta svg { width: 100%; height: 100%; display: block; }
.advisio-mark {
  position: fixed;
  right: max(1.5rem, env(safe-area-inset-right, 0px));
  bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
  z-index: 10; color: var(--advisio-red); line-height: 0;
}
.advisio-mark svg { width: 150px; height: auto; fill: currentColor; }
@media (max-width: 560px) { .advisio-mark svg { width: 110px; } }

main {
  position: relative; z-index: 1;
  max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 120px;
  display: flex; flex-direction: column; gap: 40px;
}
h1, h2, h3 { font-family: var(--font-heading); font-weight: 800; color: var(--text); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5vw, 2.75rem); line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; line-height: 1.25; }
h3 { font-size: 1.02rem; line-height: 1.35; }
.emphasis { font-family: var(--font-emphasis); font-weight: 600; font-style: italic; }
.ref-number { color: var(--accent); font-weight: 800; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.masthead { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.report-meta { font-size: .9rem; color: var(--text-muted); }

.archive { display: flex; flex-direction: column; gap: 8px; }
.archive-label { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: .88rem; min-height: 40px; padding: 6px 14px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--text);
  cursor: pointer;
}
.chip:hover { border-color: var(--advisio-navy); }
.chip[aria-pressed="true"] { background: var(--advisio-navy); border-color: var(--advisio-navy); color: #FFFFFF; }
.chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.lead {
  background: var(--surface); border-left: 3px solid var(--accent);
  padding: 18px 22px; font-size: 1.05rem; max-width: 68ch;
}
.lead p { margin: 0; }

.section { display: flex; flex-direction: column; gap: 14px; }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 2px solid var(--advisio-red); }
.icons { display: inline-flex; align-items: center; gap: 6px; line-height: 0; }
.count { margin-left: auto; font-size: .82rem; color: var(--text-muted); }

.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.item {
  display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 18px;
  padding: 16px 0; border-bottom: 1px solid var(--border);
}
.item-date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--text-muted); padding-top: 3px; }
.item-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item-body p { margin: 0; max-width: 68ch; }
.tag {
  display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 6px; margin-left: 8px; vertical-align: 2px;
}
.tag.prio { color: #FFFFFF; background: var(--accent); }
.more { border-bottom: 1px solid var(--border); }
.more > summary {
  list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: .92rem; color: var(--advisio-navy); padding: 8px 0;
}
.more > summary::-webkit-details-marker { display: none; }
.more > summary::before { content: "+"; color: var(--accent); font-weight: 800; width: 1ch; }
.more[open] > summary::before { content: "−"; }
.more > summary:hover { color: var(--accent); }
.more > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.more .items { border-top: 1px solid var(--border); }
.more .item:last-child { border-bottom: 0; }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .88rem; }
.links a { color: var(--advisio-navy); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
.links a:hover { color: var(--accent); }
.links .via { color: var(--text-muted); font-weight: 400; text-decoration-color: var(--border); }
.no-data { font-size: .95rem; color: var(--text-muted); font-style: italic; padding: 12px 0; margin: 0; }

.report-source {
  font-size: .8rem; line-height: 1.7; color: var(--text-muted);
  border-top: 1px solid var(--border); padding-top: 16px;
}
.report-source p { margin: 0; }

@media (max-width: 560px) {
  main { padding-block: 32px 110px; gap: 32px; }
  .item { grid-template-columns: minmax(0, 1fr); }
  .item-date { padding-top: 0; }
  .lead { padding: 14px 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .week { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: .4; } to { opacity: 1; } }
}
</style>
</head>

<script>
(function () {
  const data = JSON.parse(document.getElementById('report-data').textContent);
  const weeks = data.weeks || [];
  const fmtDate = new Intl.DateTimeFormat('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' });
  const fmtDay = new Intl.DateTimeFormat('cs-CZ', { day: 'numeric', month: 'numeric' });
  const d = s => new Date(s + 'T12:00:00');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const period = w => fmtDate.format(d(w.from)) + ' až ' + fmtDate.format(d(w.to));
  const sectionDefs = [
    { key: 'google', title: 'Google Ads', icon: 'icon-google' },
    { key: 'microsoft', title: 'Microsoft Advertising', icon: 'icon-microsoft' },
    { key: 'feeds', title: 'Merchant Center a nákupní kampaně', icon: null },
    { key: 'cz', title: 'Sklik, Heureka a Zboží.cz', icon: 'icon-sklik' },
    { key: 'other', title: 'Ostatní platformy', icon: null, optional: true }
  ];
  const itemWord = n => n === 1 ? 'novinka' : (n >= 2 && n <= 4 ? 'novinky' : 'novinek');

  function renderChips(activeId) {
    document.getElementById('chips').innerHTML = weeks.map(w =>
      '<button type="button" class="chip" id="chip-' + esc(w.id) + '" data-id="' + esc(w.id) + '" aria-pressed="' + (w.id === activeId) + '">' +
      esc(fmtDay.format(d(w.from)) + ' až ' + fmtDate.format(d(w.to))) + '</button>').join('');
    document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { location.hash = 'w' + b.dataset.id; }));
  }

  function renderWeek(w) {
    document.getElementById('meta').innerHTML =
      'Týden <span class="num">' + esc(period(w)) + '</span> · vygenerováno <span class="num">' + esc(fmtDate.format(d(w.generated))) + '</span>';
    let html = '';
    if (w.lead) html += '<div class="lead"><p>' + w.lead + '</p></div>';
    sectionDefs.forEach((s, i) => {
      const items = (w.sections && w.sections[s.key]) || [];
      if (s.optional && !items.length) return;
      const icon = s.icon ? '<span class="icons">' + document.getElementById(s.icon).innerHTML + '</span>' : '';
      html += '<section class="section" aria-labelledby="h-' + s.key + '"><div class="section-head">' + icon +
        '<h2 id="h-' + s.key + '">' + esc(s.title) + ' <span class="ref-number">[' + (i + 1) + ']</span></h2>' +
        '<span class="count">' + (items.length ? items.length + ' ' + itemWord(items.length) : '') + '</span></div>';
      if (!items.length) {
        html += '<p class="no-data">' + esc(w.emptyNotes && w.emptyNotes[s.key] ? w.emptyNotes[s.key] : 'Za tento týden jsme nenašli žádnou ověřenou novinku.') + '</p>';
      } else {
        const sorted = items.slice().sort((a, b) => ((a.priority || 2) - (b.priority || 2)) || (b.date > a.date ? 1 : b.date < a.date ? -1 : 0));
        const li = it =>
          '<li class="item"><div class="item-date">' + esc(fmtDay.format(d(it.date))) + '</div><div class="item-body">' +
          '<h3>' + esc(it.title) + (it.priority === 1 ? '<span class="tag prio">Důležité</span>' : '') + (it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '') + '</h3>' +
          '<p>' + esc(it.text) + '</p>' +
          '<div class="links"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">Zdroj: ' + esc(it.source) + ' ↗</a>' +
          (it.via ? '<a class="via" href="' + esc(it.via) + '" target="_blank" rel="noopener">přes PPC News Feed</a>' : '') +
          '</div></div></li>';
        const top = sorted.slice(0, 3), rest = sorted.slice(3);
        html += '<ul class="items">' + top.map(li).join('') + '</ul>';
        if (rest.length) {
          html += '<details class="more" id="more-' + s.key + '"><summary>' + (rest.length === 1 ? 'Zobrazit další novinku' : rest.length <= 4 ? 'Zobrazit další ' + rest.length + ' novinky' : 'Zobrazit dalších ' + rest.length + ' novinek') + '</summary>' +
            '<ul class="items">' + rest.map(li).join('') + '</ul></details>';
        }
      }
      html += '</section>';
    });
    const wk = document.getElementById('week');
    wk.innerHTML = html;
    wk.style.display = 'flex'; wk.style.flexDirection = 'column'; wk.style.gap = '40px';
    document.getElementById('source').innerHTML =
      '<p>Zdroje: ' + esc((w.sources || []).join(', ')) + '.</p>' +
      '<p>Období: <span class="num">' + esc(period(w)) + '</span>. Novinky vybíráme z veřejných zdrojů, u každé je odkaz na původní článek nebo nápovědu.</p>';
  }

  function show() {
    if (!weeks.length) { document.getElementById('week').innerHTML = '<p class="no-data">První týdenní přehled se tu objeví v pátek ráno.</p>'; return; }
    const id = location.hash.replace(/^#w/, '');
    const w = weeks.find(x => x.id === id) || weeks[0];
    renderChips(w.id);
    renderWeek(w);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
